
name: Compiler APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop/calculatrice-plus-v2
      - develop/calculatrice-plus-v2-2
      - develop/calculatrice-plus-v2-3
      - develop/calculatrice-plus-v2-3-1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Tests Java du moteur
        run: |
          mkdir -p test-build
          javac -encoding UTF-8 -d test-build app/src/main/java/com/calculatriceplus/app/CalculatorEngine.java tests/CalculatorEngineTest.java tests/CalculatorEngineV23Test.java
          java -Dfile.encoding=UTF-8 -cp test-build CalculatorEngineTest
          java -Dfile.encoding=UTF-8 -cp test-build CalculatorEngineV23Test

      - name: Compiler APK
        run: gradle assembleDebug --no-daemon

      - name: Recuperer APK
        uses: actions/upload-artifact@v4
        with:
          name: CalculatricePlus-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
